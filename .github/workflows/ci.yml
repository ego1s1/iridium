name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app derives its alpha version from the commit count.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK ships with the runner image, but `sdkmanager` is not
      # always on PATH, so resolve it explicitly instead of assuming.
      - name: Locate Android SDK tooling
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Could not find an Android SDK directory"
            exit 1
          fi

          SDKMANAGER=""
          for candidate in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK"
            ls -la "$SDK" || true
            exit 1
          fi

          echo "SDK=$SDK"
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version || true
          echo "--- disk ---"; df -h / | tail -1
          echo "--- preinstalled NDK ---"; ls "$SDK/ndk" 2>/dev/null || echo none
          echo "--- preinstalled CMake ---"; ls "$SDK/cmake" 2>/dev/null || echo none

          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"

      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      # Guarded so a preinstalled copy is reused instead of re-downloaded
      # (the NDK alone is ~1GB and runners have a tight disk budget).
      #
      # Deliberately NOT `set -o pipefail`: `yes` is killed by SIGPIPE the
      # moment sdkmanager exits, so pipefail reports 141 and fails the step
      # even when the install succeeded.
      - name: Install missing SDK packages
        run: |
          set -eu
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
            echo "Installing NDK 27.2.12479018..."
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;27.2.12479018"
          else
            echo "NDK 27.2.12479018 already present."
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ]; then
            echo "Installing CMake 3.22.1..."
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "cmake;3.22.1"
          else
            echo "CMake 3.22.1 already present."
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0"
          df -h / | tail -1

      - name: Verify toolchain
        run: |
          set -eu
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            || { echo "::error::NDK 27.2.12479018 not available"; exit 1; }
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1" \
            || { echo "::error::CMake 3.22.1 not available"; exit 1; }
          echo "Android toolchain ready."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Run detekt
        run: ./gradlew detekt

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
