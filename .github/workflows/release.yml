name: Release

# Cuts a GitHub Release with a signed APK + AAB whenever a version tag is
# pushed:   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
# Tags containing alpha/beta/rc publish as prereleases.
#
# Signing, in order of preference:
#   1. Repository secrets (or variables) KEYSTORE_BASE64 / KEY_ALIAS /
#      KEY_PASSWORD / STORE_PASSWORD. Keep ONE keystore forever; rotating it
#      breaks updates. This is the intended long-term setup.
#   2. If those are absent, a keystore is generated for that run so a release
#      can still be cut. NOTE: actions/cache is scoped per ref, so a
#      tag-triggered run cannot read a previous tag's cache. Each tag
#      therefore gets a FRESH key, meaning alpha builds cannot be installed
#      over one another -- users must uninstall first. Such builds say so in
#      their release notes. Configure the secrets above for stable updates.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      signing: ${{ steps.signing.outputs.mode }}
      apk: ${{ steps.sign.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag must look like v1.2.3, got '$TAG'."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      # Secrets only: repository variables are readable by anyone with
      # repo read access, so keystore material must never come from vars.
      - name: Resolve signing material
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "mode=secret" >> "$GITHUB_OUTPUT"
            echo "Using the configured release keystore."
          else
            echo "mode=generated" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets configured. Generating a throwaway key for this tag: the APK will not install over a previous release."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache is scoped per ref, so this only helps re-runs of the *same*
      # tag. It cannot carry a key between releases; that is what the
      # KEYSTORE_BASE64 secret is for.
      - name: Restore CI keystore cache
        if: steps.signing.outputs.mode == 'generated'
        uses: actions/cache@v4
        with:
          path: |
            ci-keystore.jks
            ci-keystore.pass
          key: iridium-ci-keystore-${{ github.ref_name }}

      - name: Prepare keystore
        id: keystore
        env:
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -eu
          if [ "${{ steps.signing.outputs.mode }}" = "secret" ]; then
            echo "::add-mask::$SECRET_KEY_PASS"
            echo "::add-mask::$SECRET_STORE_PASS"
            echo "$SECRET_KEYSTORE" | base64 -d > release.keystore
            printf '%s' "$SECRET_STORE_PASS" > .store.pass
            printf '%s' "$SECRET_KEY_PASS" > .key.pass
            ALIAS="$SECRET_ALIAS"
          else
            if [ ! -f ci-keystore.jks ]; then
              PASS="$(openssl rand -hex 20)"
              "$JAVA_HOME/bin/keytool" -genkeypair -v \
                -keystore ci-keystore.jks -alias iridium \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" \
                -dname "CN=Iridium CI, OU=Iridium, O=Iridium, C=US"
              printf '%s' "$PASS" > ci-keystore.pass
            fi
            PASS="$(cat ci-keystore.pass)"
            cp ci-keystore.jks release.keystore
            printf '%s' "$PASS" > .store.pass
            printf '%s' "$PASS" > .key.pass
            ALIAS="iridium"
          fi
          chmod 600 release.keystore .store.pass .key.pass
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: Locate Android SDK tooling
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Could not find an Android SDK directory"; exit 1
          fi
          SDKMANAGER=""
          for candidate in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK"; ls -la "$SDK" || true; exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version || true
          df -h / | tail -1
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"

      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install missing SDK packages
        # No `pipefail`: `yes` exits 141 on SIGPIPE when sdkmanager finishes,
        # which would fail the step despite a successful install.
        run: |
          set -eu
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;27.2.12479018"
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "cmake;3.22.1"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            || { echo "::error::NDK 27.2.12479018 not available"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Play release (APK + bundle)
        run: |
          # versionCode tracks the commit count (same as dev builds): it is
          # monotonic across tags and rebuilds, unlike run_number which
          # resets and collides across re-runs.
          CODE="$(git rev-list --count HEAD)"
          ./gradlew :app:assemblePlayRelease :app:bundlePlayRelease \
            -PappVersionName="${{ steps.resolve.outputs.tag }}" \
            -PappVersionCode="$CODE"

      - name: Assemble F-Droid release (APK)
        run: |
          # The foss variant has no Google Play Services, which is what makes
          # it acceptable to F-Droid; it ships as an APK only.
          CODE="$(git rev-list --count HEAD)"
          ./gradlew :app:assembleFossRelease \
            -PappVersionName="${{ steps.resolve.outputs.tag }}" \
            -PappVersionCode="$CODE"

      - name: Sign APK
        id: sign
        run: |
          set -eu
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          TAG="${{ steps.resolve.outputs.tag }}"
          # Both variants are signed with the same key so a user can move
          # between the Play and F-Droid builds without uninstalling.
          for VARIANT in play foss; do
            UNSIGNED="app/build/outputs/apk/$VARIANT/release/app-$VARIANT-release-unsigned.apk"
            ALIGNED="app-$VARIANT-aligned.apk"
            SIGNED="iridium-$TAG-$VARIANT.apk"
            "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
            # apksigner reads passwords from files, keeping them out of the
            # process table.
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ steps.keystore.outputs.alias }}" \
              --ks-pass "file:.store.pass" \
              --key-pass "file:.key.pass" \
              --out "$SIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED" | head -5
            rm -f "$ALIGNED"
          done
          echo "apk=iridium-$TAG-play.apk iridium-$TAG-foss.apk" >> "$GITHUB_OUTPUT"

      - name: Sign App Bundle
        id: bundle
        run: |
          set -eu
          UNSIGNED_BUNDLE=$(ls app/build/outputs/bundle/playRelease/app-play-release.aab)
          SIGNED_BUNDLE="iridium-${{ steps.resolve.outputs.tag }}.aab"
          # AABs take JAR signing (apksigner is APK-only).
          jarsigner \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass:file .store.pass \
            -keypass:file .key.pass \
            -signedjar "$SIGNED_BUNDLE" "$UNSIGNED_BUNDLE" \
            "${{ steps.keystore.outputs.alias }}"
          jarsigner -verify "$SIGNED_BUNDLE"
          echo "aab=$SIGNED_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Publish to Google Play (internal track)
        # Optional: skipped entirely when no Play service account is
        # configured, so releases still publish to GitHub and F-Droid.
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.iridium.reader
          releaseFiles: ${{ steps.bundle.outputs.aab }}
          track: internal
          status: draft

      - name: Clean up signing material
        if: always()
        run: rm -f release.keystore .store.pass .key.pass

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.bundle.outputs.aab }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Iridium ${{ needs.build.outputs.tag }}
          generate_release_notes: ${{ needs.build.outputs.signing == 'secret' }}
          body: ${{ needs.build.outputs.signing == 'generated' && '> **Alpha test build.** Signed with a throwaway key generated for this tag because no release keystore is configured, so this build will not install over a previous release — uninstall first. Set the KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD repository secrets to enable in-place updates.' || '' }}
          prerelease: ${{ contains(needs.build.outputs.tag, 'alpha') || contains(needs.build.outputs.tag, 'beta') || contains(needs.build.outputs.tag, 'rc') }}
          files: |
            ./dist/*.apk
            ./dist/*.aab
          fail_on_unmatched_files: true
