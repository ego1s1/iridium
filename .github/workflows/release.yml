name: Release

# Cuts a GitHub Release with a signed APK + AAB whenever a version tag is
# pushed:   git tag v0.1.0 && git push origin v0.1.0
# Tags containing alpha/beta/rc publish as prereleases.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64  - base64 of the .jks/.keystore used for all releases.
#                      Keep ONE keystore forever; rotating it breaks updates.
#   KEY_ALIAS        - key alias inside the keystore (e.g. "iridium")
#   KEY_PASSWORD     - password for the key
#   STORE_PASSWORD   - password for the keystore
#
# The workflow fails fast with a clear message when secrets are missing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      apk: ${{ steps.sign.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag must look like v1.2.3, got '$TAG'."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          missing=""
          for var in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. See release.yml header for setup."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK tooling
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Could not find an Android SDK directory"; exit 1
          fi
          SDKMANAGER=""
          for candidate in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK"; ls -la "$SDK" || true; exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version || true
          df -h / | tail -1
          ls "$SDK/ndk" 2>/dev/null || echo "no NDK preinstalled"
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"

      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install missing SDK packages
        # No `pipefail`: `yes` exits 141 on SIGPIPE when sdkmanager finishes,
        # which would fail the step despite a successful install.
        run: |
          set -eu
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;27.2.12479018"
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "cmake;3.22.1"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            || { echo "::error::NDK 27.2.12479018 not available"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK and bundle (unsigned)
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PappVersionName="${{ steps.resolve.outputs.tag }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Sign APK
        id: sign
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Mask secrets explicitly and keep passwords out of the process table:
          # apksigner reads them from files instead of CLI arguments.
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          printf '%s' "$STORE_PASSWORD" > .store.pass
          printf '%s' "$KEY_PASSWORD" > .key.pass
          chmod 600 release.keystore .store.pass .key.pass
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(ls app/build/outputs/apk/release/app-release-unsigned.apk)
          ALIGNED=app-release-aligned.apk
          SIGNED="iridium-${{ steps.resolve.outputs.tag }}.apk"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "file:.store.pass" \
            --key-pass "file:.key.pass" \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED" | head -5
          rm -f release.keystore "$ALIGNED" .store.pass .key.pass
          echo "apk=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Sign App Bundle
        id: bundle
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          printf '%s' "$STORE_PASSWORD" > .store.pass
          printf '%s' "$KEY_PASSWORD" > .key.pass
          chmod 600 release.keystore .store.pass .key.pass
          UNSIGNED_BUNDLE=$(ls app/build/outputs/bundle/release/app-release.aab)
          SIGNED_BUNDLE="iridium-${{ steps.resolve.outputs.tag }}.aab"
          # AABs take JAR signing (apksigner is APK-only).
          jarsigner \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass:file .store.pass \
            -keypass:file .key.pass \
            -signedjar "$SIGNED_BUNDLE" "$UNSIGNED_BUNDLE" "$KEY_ALIAS"
          jarsigner -verify "$SIGNED_BUNDLE"
          rm -f release.keystore .store.pass .key.pass
          echo "aab=$SIGNED_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.bundle.outputs.aab }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Iridium ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.tag, 'alpha') || contains(needs.build.outputs.tag, 'beta') || contains(needs.build.outputs.tag, 'rc') }}
          files: |
            ./dist/*.apk
            ./dist/*.aab
          fail_on_unmatched_files: true
